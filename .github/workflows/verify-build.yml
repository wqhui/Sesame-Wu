name: Verify Build (normal / compatible / legacy)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（默认取当前 tag 去 v 或 1.3.0）'
        required: false
        default: '1.3.0'
      build_normal:
        description: '构建 normal（现代模块 / libxposed API 102）'
        type: boolean
        default: true
      build_compatible:
        description: '构建 compatible（兼容 / libxposed 旧 API）'
        type: boolean
        default: true
      build_legacy:
        description: '构建 legacy（传统 / Xposed API ≤93）'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 只构建选中的 flavor：all 走 assembleRelease，其余逐个拼 assemble<Flavor>Release
      - name: Build selected flavors (release)
        env:
          BUILD_NORMAL: ${{ inputs.build_normal }}
          BUILD_COMPATIBLE: ${{ inputs.build_compatible }}
          BUILD_LEGACY: ${{ inputs.build_legacy }}
        run: |
          set -euo pipefail
          TASKS=""
          # 用 if 而不是 [ ] && ：set -e 下 && 左侧为假会让整个脚本退出
          if [ "$BUILD_NORMAL" = "true" ]; then
            TASKS="$TASKS assembleNormalRelease"
          fi
          if [ "$BUILD_COMPATIBLE" = "true" ]; then
            TASKS="$TASKS assembleCompatibleRelease"
          fi
          if [ "$BUILD_LEGACY" = "true" ]; then
            TASKS="$TASKS assembleLegacyRelease"
          fi
          if [ -z "$TASKS" ]; then
            echo "::error::至少要勾选一个 flavor"
            exit 1
          fi
          echo "构建任务：$TASKS"
          ./gradlew $TASKS -P "version=${{ inputs.version }}"

      # 配置了签名 secret 时自动签名；未配置则保留未签名产物（仅供编译验证，无法安装）
      - name: Sign release APKs (if signing secrets configured)
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "${ANDROID_SIGNING_KEY:-}" ]; then
            echo "::warning::未配置签名密钥，输出未签名包（仅供编译验证，无法安装）"
            exit 0
          fi
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT_DIR=$(ls -d "$SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BT_DIR"
          echo "${ANDROID_SIGNING_KEY}" | base64 -d > "$RUNNER_TEMP/wqhui-sign.jks"
          # 只签本次实际构建出来的 flavor（目录不存在即跳过）
          for flavor in normal compatible legacy; do
            APK_DIR="app/build/outputs/apk/$flavor/release"
            APK_FILE=$(find "$APK_DIR" -name "*.apk" | head -n 1)
            [ -n "$APK_FILE" ] || { echo "No APK in $APK_DIR"; continue; }
            echo "Signing $(basename "$APK_FILE")"
            "$BT_DIR/zipalign" -f 4 "$APK_FILE" "$RUNNER_TEMP/aligned.apk"
            "$BT_DIR/apksigner" sign \
              --ks "$RUNNER_TEMP/wqhui-sign.jks" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
              --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
              --out "$APK_FILE" \
              "$RUNNER_TEMP/aligned.apk"
          done

      - name: List APK outputs
        run: |
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      # 上传三种产物便于直接安装/做免 Root 测试
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: sesame-wu-apks-${{ github.run_number }}
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
